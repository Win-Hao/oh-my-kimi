# oh-my-kimi 自己的轻量 CI。
# 上游的 ci.yml / nix-build.yml / release.yml 已在仓库设置里禁用（不改文件，零冲突），
# 因为跑整个 monorepo 太重且需要上游的 secret。这里只验证 omk 包本身。
name: omk CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test @omk/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 侵入面检查要跟上游算 merge-base，拿不到浅克隆

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 单测
        run: pnpm --filter @omk/core test

      - name: 类型检查
        run: pnpm --filter @omk/core typecheck

      - name: 检查对上游的侵入面没有扩大
        run: ./scripts/omk-check-footprint.sh --committed
