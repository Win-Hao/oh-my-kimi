# oh-my-kimi 自己的轻量 CI。
# 上游的 ci.yml / nix-build.yml / release.yml 已在仓库设置里禁用（不改文件，零冲突），
# 因为跑整个 monorepo 太重且需要上游的 secret。这里只验证 omk 包本身。
name: omk CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test @omk/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 侵入面检查要跟上游算 merge-base，拿不到浅克隆

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 单测
        run: pnpm --filter @omk/core test

      - name: 类型检查
        run: pnpm --filter @omk/core typecheck

      - name: 检查对上游的侵入面没有扩大
        run: |
          # 这个 fork 的核心约束：相对上游，只允许改这两个文件。
          # 越界就说明该重新考虑「能不能改成在 omk 里加新东西」，并更新 DIVERGENCES.md。
          git remote add upstream https://github.com/MoonshotAI/kimi-code.git
          git fetch --quiet --no-tags upstream main
          BASE="$(git merge-base HEAD upstream/FETCH_HEAD 2>/dev/null || git merge-base HEAD FETCH_HEAD)"
          echo "上游基线：${BASE}"
          CHANGED="$(git diff --name-only "${BASE}..HEAD" \
            | grep -vE '^(packages/omk/|site/|scripts/omk-|\.github/workflows/omk-|README|DIVERGENCES\.md)' \
            | grep -vE '^(apps/kimi-code/src/main\.ts|apps/kimi-code/package\.json|pnpm-lock\.yaml)$' || true)"
          if [ -n "${CHANGED}" ]; then
            echo "⚠️  以下上游文件被改动，超出了约定的侵入面："
            echo "${CHANGED}" | sed 's/^/    /'
            echo "确认是有意为之的话，记进 DIVERGENCES.md 并更新本检查的白名单。"
            exit 1
          fi
          echo "✅ 侵入面仍是 main.ts + package.json"
