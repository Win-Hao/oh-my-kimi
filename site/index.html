<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oh-my-kimi</title>
<meta name="description" content="个人维护的 kimi-code 增强版。">
<style>
:root{
  --paper:#faf6ef; --ink:#2b2823; --ink-2:#6b6259;
  --rule:#e0d6c8; --accent:#9c4a2f; --paper-2:#f3ece1;
}
:root[data-theme="dark"]{
  --paper:#171513; --ink:#e9e2d6; --ink-2:#a1978a;
  --rule:#332e28; --accent:#e08a63; --paper-2:#1f1c19;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  display:flex; flex-direction:column; transition:background .25s,color .25s;
}
.wrap{max-width:640px;width:100%;margin:0 auto;padding:0 24px;flex:1;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:flex-end;padding:24px 0}
button{
  border:1px solid var(--rule);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer;transition:.2s;
}
button:hover{color:var(--ink);border-color:var(--ink-2)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 0 80px}
h1{font-size:clamp(40px,9vw,64px);margin:0 0 18px;letter-spacing:-.03em;font-weight:650;line-height:1.05}
h1 em{font-style:normal;color:var(--accent)}
p{margin:0 0 12px;color:var(--ink-2);font-size:18px}
.note{font-size:15px;margin:28px 0 32px}
a.btn{
  display:inline-block;padding:9px 18px;border-radius:8px;text-decoration:none;
  font-size:14.5px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);
  transition:.2s;
}
a.btn:hover{opacity:.88}
footer{padding:24px 0 32px;color:var(--ink-2);font-size:13.5px;border-top:1px solid var(--rule)}
footer a{color:var(--accent)}
footer p{font-size:13.5px;margin:0 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <header><button id="theme" type="button">切换主题</button></header>

  <main>
    <h1>oh-my-<em>kimi</em></h1>
    <p>个人维护的 kimi-code 增强版。</p>
    <p class="note">站点建设中。目前进展请看仓库。</p>
    <div><a class="btn" href="https://github.com/Win-Hao/oh-my-kimi">GitHub 仓库</a></div>
  </main>

  <footer>
    <p>fork 自 <a href="https://github.com/MoonshotAI/kimi-code">MoonshotAI/kimi-code</a>，遵循 MIT 许可证，版权归 Moonshot AI 所有。</p>
    <p>非官方个人项目，与 Moonshot AI 无关。</p>
  </footer>
</div>
<script>
(function(){
  var KEY='omk-theme', root=document.documentElement, saved=null;
  try{saved=localStorage.getItem(KEY)}catch(e){}
  root.setAttribute('data-theme', saved||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  document.getElementById('theme').addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem(KEY,next)}catch(e){}
  });
})();
</script>
</body>
</html>
